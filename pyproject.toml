[project]
name = "ptserver"
version = "0.1.0"
description = "VR DLNA media server with realtime green-screen or alpha passthrough"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    #   onnxruntime-directml。Windows 10/11 use。
    #   onnxruntime-gpu       — need CUDA 12 + cuDNN 9（1.19+）
    "onnxruntime-gpu>=1.19",
    "numpy>=1.26,<2.1",
    "opencv-python>=4.10",
    "pillow>=10",
    "PySide6-Essentials>=6.7",
    "cupy-cuda12x",
    "pynvvideocodec>=2.1.0",
    "pyinstaller>=6.20.0",
]

[tool.uv]
package = false


[tool.uv.sources]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
